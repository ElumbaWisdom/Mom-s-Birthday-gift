<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mom!</title>
<!-- INDEX.HTML — THE SHELL (new, Nov 10, 2026)
     This file is the front door: it is the page the QR code / link
     points to. It does three jobs and nothing else:
     1. It shows a simple Happy Birthday animation first — gold
        confetti falling, gold balloons floating, "Happy Birthday
        Mom!" — no letter, just the animation.
     2. The "Tap to begin" tap on that animation is the tap that
        starts the song (browsers block sound before a tap).
        The song is "Thank You Lord" (Don Moen), and it keeps
        playing across every page, with no restart.
     3. It holds every page inside a full-screen frame, so moving
        from landing to hub to a tile never reloads this file and
        never stops the song.
     The other two songs live here too, as audio files:
     - "I Just Want To Be Where You Are" plays on the first two
       tiles (My Greatest Motivation, My Core Support System).
     - "God Will Make A Way" plays on the next two tiles
       (Mi Familia, My Stubborn Woman).
     - LOML, the hub and the landing keep "Thank You Lord".
     The pages themselves tell this shell which song to play —
     that is the new part in script.js. When a video plays on a
     tile, the song pauses; when the video stops, the song resumes.
     All the styling in this file is inline, in the <style> below.
     style.css was NOT changed. No other HTML file was changed. -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    background: #f6e7c1;
    font-family: "Fraunces", Georgia, serif;
  }

  /* The frame that holds landing, hub and every tile. */
  #appFrame {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    z-index: 1;
    background: #f6e7c1;
  }

  /* ---- The Happy Birthday animation screen ---- */
  #intro {
    position: fixed; inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    background:
      radial-gradient(600px 300px at 8% 0%, rgba(240, 165, 0, 0.28), transparent 70%),
      radial-gradient(600px 300px at 92% 100%, rgba(207, 117, 0, 0.24), transparent 70%),
      linear-gradient(180deg, #f8ecc9 0%, #f6e7c1 55%, #eed9a4 100%);
    overflow: hidden;
    transition: opacity 0.7s ease;
  }
  #intro.fade { opacity: 0; pointer-events: none; }

  /* The same diamond lattice pattern as the landing page,
     at low opacity, so it stays soft behind the animation. */
  .intro-pattern {
    position: absolute; inset: 0;
    background-image: url("pattern-diamond.webp");
    background-size: 320px;
    background-repeat: repeat;
    opacity: 0.18;
    pointer-events: none;
  }

  /* Gold confetti falling from the top, over and over. */
  .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .confetti span {
    position: absolute;
    top: -24px;
    left: var(--x);
    width: var(--w);
    height: calc(var(--w) * 1.6);
    background: var(--c);
    border-radius: 2px;
    opacity: 0.9;
    animation: fall var(--d) linear infinite;
    animation-delay: var(--dl);
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(112vh) rotate(720deg); }
  }

  /* Gold balloons floating gently. */
  .balloon {
    position: absolute;
    bottom: 12%;
    width: 74px; height: 96px;
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    box-shadow: inset -8px -8px 16px rgba(0, 0, 0, 0.18), 0 10px 24px rgba(0, 0, 0, 0.15);
    animation: floatBalloon 3.2s ease-in-out infinite alternate;
    z-index: 1;
  }
  .balloon::after {
    content: "";
    position: absolute;
    left: 50%; top: 100%;
    width: 2px; height: 70px;
    background: rgba(0, 0, 0, 0.35);
  }
  .balloon-left  { left: 8%;  background: radial-gradient(circle at 35% 30%, #ffd76a, #f0a500 60%, #cf7500); animation-delay: 0s; }
  .balloon-right { right: 8%; background: radial-gradient(circle at 35% 30%, #ffe9a8, #eed9a4 60%, #cf7500); animation-delay: 1.1s; }
  @keyframes floatBalloon {
    from { transform: translateY(0); }
    to   { transform: translateY(-28px); }
  }

  .intro-title {
    position: relative;
    z-index: 2;
    font-family: "Great Vibes", cursive;
    font-weight: 400;
    font-size: clamp(3.2rem, 11vw, 5.5rem);
    line-height: 1.05;
    color: #cf7500;
    margin: 0 0 10px;
    text-shadow: 0 2px 0 #ffffff, 0 8px 26px rgba(240, 165, 0, 0.4);
    animation: glow 2.4s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 2px 0 #ffffff, 0 8px 22px rgba(240, 165, 0, 0.35); }
    to   { text-shadow: 0 2px 0 #ffffff, 0 8px 34px rgba(240, 165, 0, 0.65); }
  }

  .intro-sub {
    position: relative;
    z-index: 2;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.2rem, 3.5vw, 1.5rem);
    color: #333333;
    margin: 0 0 34px;
    max-width: 560px;
  }

  /* The tap that starts the song and opens the landing page.
     Black button, gold text, gold border — same look as the
     "Tap to continue" button on the landing page. */
  #beginBtn {
    position: relative;
    z-index: 2;
    padding: 17px 46px;
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #f0a500;
    background: #000000;
    border: 2px solid #f0a500;
    border-radius: 14px;
    box-shadow: 0 0 0 4px rgba(240, 165, 0, 0.25), 0 12px 28px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }
  #beginBtn::after { content: "  \2192"; color: #f0a500; }
  #beginBtn:hover { transform: translateY(-2px); }

  .intro-note {
    position: relative;
    z-index: 2;
    margin: 22px 0 0;
    font-size: 1rem;
    color: #555555;
  }

  /* ---- Song pause / play button, bottom-right ---- */
  #songBtn {
    position: fixed;
    right: 18px; bottom: 18px;
    z-index: 4;
    padding: 12px 20px;
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: 1rem;
    color: #f0a500;
    background: #000000;
    border: 2px solid #f0a500;
    border-radius: 999px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }
  #songBtn.hidden { display: none; }

  @media (max-width: 640px) {
    .balloon { width: 54px; height: 70px; }
    .balloon-left { left: 4%; }
    .balloon-right { right: 4%; }
    #beginBtn { width: min(320px, 100%); padding: 14px 24px; }
  }
</style>
</head>
<body>

<!-- Every page loads inside this frame. -->
<iframe id="appFrame" src="landing.html" title="Mom's birthday app"></iframe>

<!-- The Happy Birthday animation. One tap starts the song
     and opens the landing page behind it. -->
<div id="intro">
  <div class="intro-pattern" aria-hidden="true"></div>
  <div class="confetti" aria-hidden="true">
    <span style="--x:2%;  --w:10px; --c:#f0a500; --d:9s;  --dl:0s"></span>
    <span style="--x:7%;  --w:8px;  --c:#cf7500; --d:11s; --dl:2s"></span>
    <span style="--x:13%; --w:12px; --c:#ffd76a; --d:8s;  --dl:1s"></span>
    <span style="--x:19%; --w:9px;  --c:#f0a500; --d:12s; --dl:4s"></span>
    <span style="--x:25%; --w:11px; --c:#cf7500; --d:10s; --dl:0.5s"></span>
    <span style="--x:31%; --w:8px;  --c:#ffd76a; --d:9s;  --dl:3s"></span>
    <span style="--x:37%; --w:12px; --c:#f0a500; --d:11s; --dl:1.5s"></span>
    <span style="--x:43%; --w:9px;  --c:#cf7500; --d:8s;  --dl:5s"></span>
    <span style="--x:49%; --w:10px; --c:#ffd76a; --d:12s; --dl:2.5s"></span>
    <span style="--x:55%; --w:8px;  --c:#f0a500; --d:10s; --dl:0s"></span>
    <span style="--x:61%; --w:11px; --c:#cf7500; --d:9s;  --dl:4s"></span>
    <span style="--x:67%; --w:9px;  --c:#ffd76a; --d:11s; --dl:1s"></span>
    <span style="--x:73%; --w:12px; --c:#f0a500; --d:8s;  --dl:3.5s"></span>
    <span style="--x:79%; --w:8px;  --c:#cf7500; --d:12s; --dl:0.5s"></span>
    <span style="--x:85%; --w:10px; --c:#ffd76a; --d:10s; --dl:2s"></span>
    <span style="--x:91%; --w:9px;  --c:#f0a500; --d:9s;  --dl:4.5s"></span>
    <span style="--x:96%; --w:11px; --c:#cf7500; --d:11s; --dl:1.5s"></span>
  </div>
  <div class="balloon balloon-left" aria-hidden="true"></div>
  <div class="balloon balloon-right" aria-hidden="true"></div>
  <h1 class="intro-title">Happy Birthday Mom!</h1>
  <p class="intro-sub">A little surprise, made with love — just for you</p>
  <button id="beginBtn" type="button">Tap to begin &#9834;</button>
  <p class="intro-note">Tap once — the song starts, and your surprise opens.</p>
</div>

<button id="songBtn" class="hidden" type="button">&#9834; Pause song</button>

<!-- The three songs. All three sit here in the shell, beside
     index.html, so they never restart when a page changes.
     Thank You Lord is the overall song; the other two are
     switched in by the pages that need them. -->
<audio id="songThankYou" src="Thank-you-Lord.mp3" loop preload="metadata"></audio>
<audio id="songWhereYouAre" src="I-just-want-to-be-where-you-are.mp3" loop preload="metadata"></audio>
<audio id="songMakeAWay" src="God-will-make-a-way.mp3" loop preload="metadata"></audio>

<script>
  // ---- Shell song player ----
  // Three songs, one playing at a time. Pausing a song keeps
  // its place, so going back to it resumes where it left off
  // instead of starting over.
  var songs = {
    "song-overall": document.getElementById("songWhereYouAre"), // WhereYouAre, the overall song
    "song-where-you-are": document.getElementById("songWhereYouAre"),
    "song-make-a-way": document.getElementById("songMakeAWay")
  };
  var activeSong = "song-overall"; // Thank You Lord, the overall song
  var songOn = false;              // turns true on the Begin tap
  var videoPlaying = false;        // true while a tile video plays
  var intro = document.getElementById("intro");
  var beginBtn = document.getElementById("beginBtn");
  var songBtn = document.getElementById("songBtn");

  function pauseAllSongs() {
    Object.keys(songs).forEach(function (key) { songs[key].pause(); });
  }

  function playActiveSong() {
    if (!songOn || videoPlaying) { return; }
    pauseAllSongs();
    var audio = songs[activeSong];
    if (audio) {
      var playPromise = audio.play();
      if (playPromise) { playPromise.catch(function () {}); }
    }
  }

  function setSong(name) {
    if (!songs[name]) { return; }
    if (name !== activeSong) {
      pauseAllSongs();
      activeSong = name;
    }
    playActiveSong();
  }

  // ---- Messages from the pages inside the frame ----
  // script.js sends these exact words:
  //   video-play / video-pause / video-ended
  //   song-overall / song-where-you-are / song-make-a-way
  window.addEventListener("message", function (event) {
    var type = event.data && event.data.type;
    if (!type) { return; }
    if (type === "video-play") {
      videoPlaying = true;
      pauseAllSongs();
    } else if (type === "video-pause" || type === "video-ended") {
      videoPlaying = false;
      playActiveSong();
    } else if (songs[type]) {
      setSong(type);
    }
  });

  // ---- The Begin tap: start Thank You Lord, open the landing ----
  beginBtn.addEventListener("click", function () {
    songOn = true;
    playActiveSong();
    songBtn.classList.remove("hidden");
    intro.classList.add("fade");
    setTimeout(function () { intro.style.display = "none"; }, 750);
  });

  // ---- Pause / play the song, wherever she is in the app ----
  songBtn.addEventListener("click", function () {
    songOn = !songOn;
    if (songOn) {
      playActiveSong();
      songBtn.innerHTML = "&#9834; Pause song";
    } else {
      pauseAllSongs();
      songBtn.innerHTML = "&#9834; Play song";
    }
  });
</script>
</body>
</html>
